<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = c.width = window.innerWidth; H = c.height = window.innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3, s: Math.random() * 0.6 + 0.15,
      hue: 190 + Math.random() * 90
    }));
  }
  window.addEventListener('resize', resize); resize();
  function loop() {
    ctx.fillStyle = 'rgba(11,16,32,0.25)';
    ctx.fillRect(0, 0, W, H);
    for (const st of stars) {
      st.y += st.s; if (st.y > H) { st.y = 0; st.x = Math.random() * W; }
      ctx.beginPath();
      ctx.fillStyle = `hsl(${st.hue},80%,75%)`;
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
