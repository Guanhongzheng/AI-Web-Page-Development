services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=file:./dev.db
      - SOCKET_PORT=3001
    volumes:
      - pm-data:/app/prisma
    restart: unless-stopped

  # 可选：网易云音乐 API Enhanced
  netease:
    image: binaryify/netease_cloud_music_api:latest
    ports:
      - "3100:3000"
    restart: unless-stopped
    profiles: ["music"]

  # 可选：向量模型（bge-m3 / bge-reranker）
  embedding:
    image: ghcr.io/huggingface/text-generation-inference:latest
    profiles: ["embedding"]
    restart: unless-stopped

volumes:
  pm-data:
